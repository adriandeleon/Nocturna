name: CI

# On every push to main and every pull request: Android Lint, the JVM unit tests and a debug build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Nothing here writes to the repository. Every action is pinned to a commit SHA with its version in a
# trailing comment; Dependabot keeps both current.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the previous one. Every other run has a
# group of its own (its commit), so a run on main is never cancelled or dropped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle's dependencies and build cache, and validates the committed wrapper jar.
      # Only runs on main write the cache; pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runner's preinstalled Android SDK (ANDROID_HOME) is used; AGP fetches a missing platform.
      - name: Lint, test and build
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      # Even when the build passes: the reports are how a lint warning or a slow test is found.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nocturna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
